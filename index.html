<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="./styles.css" type="text/css">
</head>

<body>
  <div class="container">
    <div class="dashboard">
      <div class="head">
        <img src="./images/dash/dashboard.svg">
        <p>Dashboard</p>
      </div>
      <div class="dash-block-one">
        <img src="./images/dash/home.svg">
        <p>Home</p>
        <img src="./images/dash/profile.svg">
        <p>Profile</p>
        <img src="./images/dash/messages.svg">
        <p>Messages</p>
        <img src="./images/dash/history.svg">
        <p>History</p>
        <img src="./images/dash/tasks.svg">
        <p>Tasks</p>
        <img src="./images/dash/communities.svg">
        <p>Communities</p>
      </div>
      <div class="dash-block-two">
        <img src="./images/dash/settings.svg">
        <p>Settings</p>
        <img src="./images/dash/support.svg">
        <p>Support</p>
        <img src="./images/dash/privacy.svg">
        <p>Privacy</p>
      </div>
    </div>
    <div class="header">
      <div class="search">
        <img src="./images/search.svg">
        <input type="text">
      </div>
      <div class="notices">
        <img class="x" src="./images/bell-ring.svg">
        <img src="./images/avatars/avatar-prof.png" class="avatar">
        <scan>Morgan Oakley</scan>
      </div>
      <div class="greeting">
        <img src="./images/avatars/avatar-prof.png" class="avatar">
        <p>Hi there,</p>
        <p>Morgan Oakley @(morgan)</p>
      </div>
      <div class="buttons">
        <button>New</button>
        <button>Upload</button>
        <button>Share</button>
      </div>
    </div>
    <div class="projects">
      space for projects
    </div>
  </div>
</body>

</html>
